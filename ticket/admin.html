<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 — アイバレエスタジオ 第2回発表会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink:       #e8a0b4;
      --pink-dark:  #c4607e;
      --pink-light: #fce8ef;
      --pink-pale:  #fff5f8;
      --gold:       #c9a84c;
      --navy:       #1a2a4a;
      --navy-mid:   #2d4070;
      --text:       #1a1a2e;
      --text-muted: #6a6a8a;
      --border:     #e0d8e8;
      --bg:         #faf8fc;
      --surface:    #ffffff;
      --green:      #3a8a5c;
      --green-light:#e0f5ea;
      --red:        #c0404a;
      --red-light:  #fce8ea;
      --shadow-sm:  0 2px 8px rgba(180,120,160,0.10);
      --shadow-md:  0 6px 24px rgba(180,120,160,0.16);
      --radius-sm:  8px;
      --radius-md:  14px;
      --radius-lg:  20px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ヘッダー */
    .site-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
      padding: 16px 20px;
      text-align: center;
    }
    .header-title { font-size: 16px; font-weight: 700; color: #fff; }
    .header-sub   { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 2px; }
    .header-badge {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 99px;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
    }

    /* メイン */
    .main { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

    /* 統計カード */
    .admin-stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 20px;
      flex: 1;
      min-width: 90px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--navy); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ツールバー */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
    }
    .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 700;
      font-family: 'Noto Serif JP', serif;
      cursor: pointer;
      border: none;
      transition: all 0.18s;
    }
    .btn-green  { background: var(--green); color: #fff; }
    .btn-green:hover  { background: #2a6a44; }
    .btn-red    { background: none; color: var(--red); border: 1.5px solid var(--red); }
    .btn-red:hover    { background: var(--red-light); }

    /* テーブル */
    .table-wrap {
      overflow-x: auto;
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
    thead tr { background: var(--navy); }
    thead th {
      padding: 12px 14px;
      text-align: left;
      font-weight: 700;
      color: #fff;
      font-size: 12px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--pink-pale); }
    tbody td { padding: 11px 14px; vertical-align: top; color: var(--text); }

    .td-purpose {
      display: inline-block;
      background: var(--pink-light);
      color: var(--pink-dark);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .td-sub { font-size: 12px; color: var(--text-muted); }

    .btn-cancel-row {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: 1.5px solid var(--red);
      color: var(--red);
      font-size: 12px;
      font-weight: 700;
      font-family: 'Noto Serif JP', serif;
      padding: 5px 12px;
      border-radius: 99px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-cancel-row:hover { background: var(--red); color: #fff; }

    /* データなし */
    .no-data { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .no-data-icon { font-size: 48px; margin-bottom: 12px; }

    /* トースト */
    .toast-container {
      position: fixed; bottom: 24px; right: 16px;
      display: flex; flex-direction: column; gap: 8px; z-index: 999;
    }
    .toast {
      background: var(--navy); color: #fff;
      padding: 12px 20px; border-radius: var(--radius-md);
      box-shadow: var(--shadow-md); font-size: 14px; font-weight: 600;
      animation: toastIn 0.25s ease; display: flex; align-items: center; gap: 8px;
    }
    .toast.success { background: #1e5c3a; }
    .toast.error   { background: #8a1e28; }
    @keyframes toastIn { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }

    /* レスポンシブ */
    @media (max-width: 480px) {
      .stat-num { font-size: 22px; }
      .toolbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-badge">管理者専用</div>
  <div class="header-title">アイバレエスタジオ 第2回発表会</div>
  <div class="header-sub">申込一覧 / キャンセル管理</div>
</header>

<main class="main">

  <!-- 統計 -->
  <div class="admin-stats" id="adminStats"></div>

  <!-- ツールバー -->
  <div class="toolbar">
    <div class="toolbar-title">📋 申込一覧</div>
    <div class="toolbar-actions">
      <button class="btn btn-green" onclick="exportCSV()">📥 CSVダウンロード</button>
      <button class="btn btn-red"   onclick="clearAllData()">🗑 全件削除</button>
    </div>
  </div>

  <!-- テーブル -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>No.</th>
          <th>申込日時</th>
          <th>代表者名</th>
          <th>年齢</th>
          <th>目的</th>
          <th>詳細</th>
          <th>お連れ様</th>
          <th>合計</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="adminTableBody">
        <tr>
          <td colspan="9">
            <div class="no-data">
              <div class="no-data-icon">📭</div>
              <div>まだ申込はありません</div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</main>

<div class="toast-container" id="toastContainer"></div>

<script>
const STORAGE_KEY = 'ai_ballet_tickets_v1';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}
function saveData(arr) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatDatetime(d) {
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} `
       + `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function showToast(msg, type = 'info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function renderAdmin() {
  const data = loadData();

  // 統計
  const totalPeople    = data.reduce((s, r) => s + 1 + r.companions.length, 0);
  const performerCount = data.filter(r => r.purpose === 'performer').length;
  const trialCount     = data.filter(r => r.purpose === 'trial').length;
  document.getElementById('adminStats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${data.length}</div><div class="stat-label">申込件数</div></div>
    <div class="stat-card"><div class="stat-num">${totalPeople}</div><div class="stat-label">合計来場者数</div></div>
    <div class="stat-card"><div class="stat-num">${performerCount}</div><div class="stat-label">出演者関係者</div></div>
    <div class="stat-card"><div class="stat-num">${trialCount}</div><div class="stat-label">体験・入会検討</div></div>
  `;

  const tbody = document.getElementById('adminTableBody');
  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="no-data"><div class="no-data-icon">📭</div><div>まだ申込はありません</div></div></td></tr>`;
    return;
  }

  // テーブル行をDOMで生成（スマホ対応）
  tbody.innerHTML = '';
  data.forEach((r, idx) => {
    const purposeLabel = r.purpose === 'performer' ? '出演者関係者' : '体験・入会検討';
    const detail = r.purpose === 'performer'
      ? `出演者：${escHtml(r.performerName)}`
      : escHtml(r.contact);
    const comps = r.companions.length > 0
      ? r.companions.map(c => escHtml(c)).join('、')
      : '<span style="color:#b0a8b8;">なし</span>';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${r.no}</b></td>
      <td style="font-size:12px;white-space:nowrap;">${formatDatetime(new Date(r.ts))}</td>
      <td><b>${escHtml(r.repName)}</b></td>
      <td>${r.repAge}</td>
      <td><span class="td-purpose">${purposeLabel}</span></td>
      <td><span class="td-sub">${detail}</span></td>
      <td><span class="td-sub">${comps}</span></td>
      <td>${1 + r.companions.length}名</td>
      <td></td>
    `;

    // キャンセルボタンをDOMで追加
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-cancel-row';
    cancelBtn.textContent = '🗑 キャンセル';
    cancelBtn.addEventListener('click', () => deleteRecord(idx, r.repName));
    tr.querySelector('td:last-child').appendChild(cancelBtn);

    tbody.appendChild(tr);
  });
}

function deleteRecord(idx, name) {
  if (!confirm(`「${name}」様の申込をキャンセル・削除しますか？\nこの操作は取り消せません。`)) return;
  const data = loadData();
  data.splice(idx, 1);
  saveData(data);
  renderAdmin();
  showToast(`「${name}」様の申込を削除しました`, 'success');
}

function clearAllData() {
  if (!confirm('全ての申込データを削除しますか？\nこの操作は取り消せません。')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderAdmin();
  showToast('全データを削除しました', 'success');
}

function exportCSV() {
  const data = loadData();
  if (data.length === 0) { showToast('申込データがありません', 'error'); return; }
  const bom = '\uFEFF';
  const header = ['No.', '申込日時', '代表者名', '年齢', '目的', '出演者名', 'メールアドレス', 'お連れ様', '合計人数'];
  const rows = data.map(r => [
    r.no,
    formatDatetime(new Date(r.ts)),
    r.repName,
    r.repAge,
    r.purpose === 'performer' ? '出演者関係者' : '体験・入会検討',
    r.performerName || '',
    r.contact || '',
    r.companions.join(' / '),
    1 + r.companions.length,
  ]);
  const csv = bom + [header, ...rows].map(row =>
    row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `ballet_tickets_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSVをダウンロードしました 📥', 'success');
}

// 初期描画
renderAdmin();
</script>
</body>
</html>
